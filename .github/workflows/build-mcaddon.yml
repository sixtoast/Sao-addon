name: Build Minecraft Add-on

on:
  push:
    branches:
      - feature/heavy-attack-button-v0.5
      - feature/heavy-attack-token-fix-v0.6
      - feature/server-form-overlay-heavy-button-v0.4.9
      - feature/heavy-item-use-fallback-v0.5.0
      - feature/hold-attack-charge-v0.5.1
      - prototype/combat-line-of-sight
    paths:
      - 'Aincrad_BP/**'
      - 'Aincrad_RP/**'
      - '.github/workflows/build-mcaddon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate JavaScript and pack JSON
        run: |
          node --check Aincrad_BP/scripts/main.js
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path('Aincrad_BP'), Path('Aincrad_RP')):
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
          print('All pack JSON files parse successfully.')
          PY

      - name: Package Behaviour Pack
        run: |
          cd Aincrad_BP
          zip -qr ../Aincrad_BP.mcpack .

      - name: Package Resource Pack
        run: |
          cd Aincrad_RP
          zip -qr ../Aincrad_RP.mcpack .

      - name: Package add-on
        run: zip -q Aincrad-Combat.mcaddon Aincrad_BP.mcpack Aincrad_RP.mcpack

      - name: Upload installable add-on
        uses: actions/upload-artifact@v4
        with:
          name: Aincrad-Combat-mcaddon
          path: Aincrad-Combat.mcaddon
          if-no-files-found: error
          retention-days: 14
